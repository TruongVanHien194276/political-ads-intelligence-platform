[build-system]
requires = ["setuptools>=80,<90", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "political-ads-intelligence-platform"
version = "0.1.0"
description = "Political ads data engineering portfolio project"
requires-python = ">=3.14,<3.15"
dependencies = [
  "google-cloud-bigquery==3.46.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.14,<1",
]

[project.scripts]
political-ads = "political_ads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]